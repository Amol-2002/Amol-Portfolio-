<svg width="800" height="1422" viewBox="0 0 800 1422" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Gradient -->
  <defs>
    <linearGradient id="bgGrad" x1="400" y1="0" x2="400" y2="1422" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="45%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#090D16"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0" y1="0" x2="80" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="phoneCardGrad" x1="0" y1="0" x2="520" y2="820" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-10%" width="140%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="800" height="1422" fill="url(#bgGrad)"/>

  <!-- Decorative Background Circles -->
  <circle cx="700" cy="180" r="280" fill="#6366F1" fill-opacity="0.12" filter="blur(60px)"/>
  <circle cx="100" cy="400" r="220" fill="#10B981" fill-opacity="0.1" filter="blur(50px)"/>

  <!-- Top App Icon & Header -->
  <g transform="translate(100, 90)">
    <!-- Shield / Phone Icon -->
    <rect x="0" y="0" width="80" height="80" rx="22" fill="url(#shieldGrad)"/>
    <path d="M40 22C32 22 26 27 26 34C26 47 43 61 43 61C43 61 60 47 60 34C60 27 54 22 46 22H40ZM36 31C38.2 31 40 32.8 40 35C40 37.2 38.2 39 36 39C33.8 39 32 37.2 32 35C32 32.8 33.8 31 36 31Z" fill="#FFFFFF"/>
    
    <!-- Title Text -->
    <text x="104" y="52" fill="#FFFFFF" font-family="'Poppins', sans-serif" font-size="48" font-weight="700" letter-spacing="-0.5">Caller ID</text>
  </g>

  <!-- Big Headline -->
  <text x="100" y="240" fill="#FFFFFF" font-family="'Poppins', sans-serif" font-size="52" font-weight="800" line-height="1.2">
    Smart Caller ID
  </text>
  <text x="100" y="300" fill="#34D399" font-family="'Poppins', sans-serif" font-size="44" font-weight="700">
    &amp; Spam Detection
  </text>
  <text x="100" y="350" fill="#94A3B8" font-family="'Poppins', sans-serif" font-size="24" font-weight="500">
    Know who is calling before you answer
  </text>

  <!-- Feature Pills -->
  <g transform="translate(100, 385)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="180" height="42" rx="21" fill="#334155" fill-opacity="0.8"/>
    <text x="24" y="27" fill="#E2E8F0" font-family="'Poppins', sans-serif" font-size="16" font-weight="600">🛡️ Spam Block</text>

    <!-- Pill 2 -->
    <rect x="195" y="0" width="200" height="42" rx="21" fill="#334155" fill-opacity="0.8"/>
    <text x="220" y="27" fill="#E2E8F0" font-family="'Poppins', sans-serif" font-size="16" font-weight="600">⚡ Live Call Info</text>

    <!-- Pill 3 -->
    <rect x="410" y="0" width="180" height="42" rx="21" fill="#334155" fill-opacity="0.8"/>
    <text x="432" y="27" fill="#E2E8F0" font-family="'Poppins', sans-serif" font-size="16" font-weight="600">🎨 Material 3</text>
  </g>

  <!-- Smartphone Mockup -->
  <g transform="translate(140, 470)" filter="url(#shadow)">
    <!-- Outer Phone Body -->
    <rect x="0" y="0" width="520" height="900" rx="48" fill="#1E293B" stroke="#475569" stroke-width="6"/>
    <!-- Inner Screen -->
    <rect x="12" y="12" width="496" height="876" rx="40" fill="url(#phoneCardGrad)"/>

    <!-- Punch Hole Camera & Speaker -->
    <circle cx="260" cy="35" r="9" fill="#000000"/>
    <rect x="235" y="18" width="50" height="4" rx="2" fill="#334155"/>

    <!-- Status Bar -->
    <text x="45" y="42" fill="#94A3B8" font-family="'Poppins', sans-serif" font-size="15" font-weight="600">9:41</text>
    <path d="M435 32H455V44H435z" fill="#94A3B8"/>
    <circle cx="420" cy="38" r="4" fill="#94A3B8"/>

    <!-- Incoming Call Header -->
    <text x="260" y="130" text-anchor="middle" fill="#94A3B8" font-family="'Poppins', sans-serif" font-size="20" font-weight="500" letter-spacing="2">INCOMING CALL</text>

    <!-- Caller Avatar -->
    <g transform="translate(260, 240)">
      <circle cx="0" cy="0" r="65" fill="#3B82F6" fill-opacity="0.2"/>
      <circle cx="0" cy="0" r="54" fill="#1E40AF"/>
      <text x="0" y="18" text-anchor="middle" fill="#FFFFFF" font-family="'Poppins', sans-serif" font-size="50" font-weight="700">JS</text>
      <!-- Verified Badge -->
      <circle cx="40" cy="40" r="18" fill="#10B981" stroke="#0F172A" stroke-width="4"/>
      <path d="M34 40L38 44L46 36" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Caller Name & Details -->
    <text x="260" y="360" text-anchor="middle" fill="#FFFFFF" font-family="'Poppins', sans-serif" font-size="34" font-weight="700">Johnathan Smith</text>
    <text x="260" y="398" text-anchor="middle" fill="#94A3B8" font-family="'Poppins', sans-serif" font-size="20" font-weight="500">+91 98765 43210 • Pune</text>

    <!-- Verification / Spam Tag -->
    <g transform="translate(260, 440)">
      <rect x="-140" y="-18" width="280" height="36" rx="18" fill="#065F46" fill-opacity="0.7"/>
      <text x="0" y="6" text-anchor="middle" fill="#34D399" font-family="'Poppins', sans-serif" font-size="16" font-weight="600">✓ Verified Business Caller</text>
    </g>

    <!-- Call Features Container -->
    <g transform="translate(48, 510)">
      <rect x="0" y="0" width="424" height="110" rx="18" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="24" y="38" fill="#F8FAFC" font-family="'Poppins', sans-serif" font-size="17" font-weight="600">Caller Identification</text>
      <text x="24" y="66" fill="#94A3B8" font-family="'Poppins', sans-serif" font-size="14">Identified via Jetpack Compose &amp; Firebase</text>
      <rect x="330" y="22" width="70" height="26" rx="6" fill="#0284C7"/>
      <text x="365" y="40" text-anchor="middle" fill="#FFFFFF" font-family="'Poppins', sans-serif" font-size="12" font-weight="700">ACTIVE</text>
    </g>

    <!-- Bottom Action Buttons -->
    <!-- Decline Button -->
    <g transform="translate(130, 720)">
      <circle cx="0" cy="0" r="42" fill="#EF4444"/>
      <!-- Hangup Icon -->
      <path d="M-18 6C-10 -4 10 -4 18 6L12 12C7 9 0 9 -5 12L-18 6Z" fill="#FFFFFF"/>
      <text x="0" y="62" text-anchor="middle" fill="#94A3B8" font-family="'Poppins', sans-serif" font-size="14" font-weight="600">Decline</text>
    </g>

    <!-- Accept Button -->
    <g transform="translate(390, 720)">
      <circle cx="0" cy="0" r="42" fill="#10B981"/>
      <!-- Call Answer Icon -->
      <path d="M-8 -12C-3 -14 5 -14 10 -9L6 -3C3 -5 -1 -5 -4 -3L-8 -7Z" fill="#FFFFFF" transform="rotate(35)"/>
      <path d="M-10 -10C-16 -4 -16 6 -8 14C0 22 10 22 16 16L9 9C6 11 2 10 -2 6C-6 2 -7 -2 -5 -5L-10 -10Z" fill="#FFFFFF"/>
      <text x="0" y="62" text-anchor="middle" fill="#94A3B8" font-family="'Poppins', sans-serif" font-size="14" font-weight="600">Answer</text>
    </g>
  </g>
</svg>
